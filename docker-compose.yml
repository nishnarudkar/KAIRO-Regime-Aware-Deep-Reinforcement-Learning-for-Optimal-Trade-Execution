services:
  # ── 1. FastAPI Backend Service ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairo_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Browsers call the API from the host, so allow the dashboard's public origin.
      - KAIRO_CORS_ORIGINS=${KAIRO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Required for /paper and /kill-switch (they are refused when unset).
      - KAIRO_API_KEY=${KAIRO_API_KEY:-}
      - KAIRO_DB_PATH=/app/data/kairo.db
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
    volumes:
      - kairo_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── 2. Next.js Frontend Dashboard ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time and are used by the *browser*,
        # so this must be a URL reachable from the user's machine, not the compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: kairo_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. MLflow Experiment Tracking Server ──────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: kairo_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/artifacts
    restart: unless-stopped

volumes:
  mlflow_data:
  kairo_data:
