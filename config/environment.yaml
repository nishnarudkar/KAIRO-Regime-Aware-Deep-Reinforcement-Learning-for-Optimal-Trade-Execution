# NOTE: values are checked against the code defaults by tests/test_config_consistency.py
environment:
  max_steps: 30
  time_horizon_seconds: 1800
  initial_inventory: 100000
  action_fractions: [0.0, 0.10, 0.25, 0.50]
  max_participation_rate: 0.15
  default_spread_bps: 2.0

impact_model:
  type: "almgren_chriss"
  eta: 0.5       # Temporary impact (square-root law: eta * sigma_bar * sqrt(q/V) * P)
  gamma: 0.001   # Permanent impact (linear in participation)
  alpha: 0.5     # Power law exponent for volume fraction

reward:
  lambda_cost: 1.0
  lambda_impact: 1.0
  lambda_risk: 1.0e-4
  lambda_fee: 1.0
  lambda_terminal: 10.0
  reward_scale: 10000.0   # reward expressed in bps of parent-order notional
